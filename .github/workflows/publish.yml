name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  # The test suite drives the real OS keystore, which a CI runner cannot
  # provide: Linux runners have no D-Bus session for the Secret Service, and a
  # macOS runner's login keychain rejects non-interactive writes with "User
  # interaction is not allowed". Running them here would fail for reasons that
  # say nothing about the code, so the keystore tests are run on a real desktop
  # session instead. Lint and a full cross-platform build still gate publish.
  # The suite drives the real keystore, which needs a D-Bus session with an
  # unlocked keyring -- a runner has neither.
  #
  # Two details make this work, and both were found the hard way: the keyrings
  # directory must exist first, and the password must be a newline rather than
  # an empty string. Without them gnome-keyring never creates the login
  # collection and falls back to a GUI prompter, which on a headless runner
  # blocks forever instead of failing. Verified against this recipe in a Linux
  # container before being trusted here; timeout-minutes keeps a regression to
  # ten minutes rather than six hours.
  test-linux:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Start a Secret Service session
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/share/keyrings"
          printf '\n' | gnome-keyring-daemon --unlock --components=secrets --daemonize

      - uses: aux4/action@v1
        with:
          command: test
          build_command: aux4 builder linux

  # macOS refuses non-interactive writes to the *login* keychain ("User
  # interaction is not allowed"), because it is locked. The fix is the same
  # shape as the Linux one: do not fight the default keychain, create a fresh
  # one with a known password and unlock it. set-keychain-settings drops the
  # auto-lock timeout so a slow run cannot re-lock it mid-suite.
  #
  # The provider passes no -k, so it writes to whichever keychain is default --
  # making it default is enough, and no production code changes for the test.
  test-darwin:
    needs: [lint]
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Create an unlocked keychain
        run: |
          security create-keychain -p "" aux4-test.keychain
          security set-keychain-settings aux4-test.keychain
          security unlock-keychain -p "" aux4-test.keychain
          security default-keychain -s aux4-test.keychain
          security list-keychains -d user -s aux4-test.keychain

      - uses: aux4/action@v1
        with:
          command: test
          build_command: aux4 builder darwin

  publish:
    needs: [lint, test-linux, test-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          build_command: aux4 builder all
          aux4_token: ${{ secrets.AUX4_ACCESS_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
